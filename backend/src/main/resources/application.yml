server:
  port: ${PORT:8081}

spring:
  config:
    import: optional:file:./.env
  application:
    name: finance-monitoring-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:finance_monitoring_shadow}
    username: ${DB_USER:finance_monitoring}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

fast2sms:
  api:
    key: ${FAST2SMS_API_KEY:}

twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:}
  auth:
    token: ${TWILIO_AUTH_TOKEN:}
  from:
    number: ${TWILIO_FROM_NUMBER:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
