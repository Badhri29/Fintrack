server:
  port: ${PORT:8081}

spring:
  config:
    import: optional:file:./.env
  application:
    name: finance-monitoring-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:finance_monitoring_shadow}
    username: ${DB_USER:finance_monitoring}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000